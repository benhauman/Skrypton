    steps:

    # FIX for Nerdbank.GitVersioning: disable shallow clone
    - checkout: self
      clean: true
      fetchDepth: 0

    - script: echo "Running init in Job Init2"
      displayName: "Init 'that'"

    - template: azure-pipelines-template/initialize.yml

    - script: |
        echo Add publishNuGetPackages:${{ parameters.publishNuGetPackages }}...
        echo See buildPlatform:$(buildPlatform), buildConfiguration:$(buildConfiguration)...
      displayName: 'Run a multiline script'

    - task: NuGetToolInstaller@1

    - task: UseDotNet@2
      displayName: "🔰 Ensure .NET 10 SDK"
      inputs:
        packageType: 'sdk'
        version: '10.0.301'
        includePreview: false

    - task: CmdLine@2
      displayName: 'Verify dotnet/sdk'
      inputs:
        script: |
          dotnet --version
          dotnet --list-sdks
          dotnet --info

    # Use dotnet CLI for restore/build/test so the installed SDK is used
    - task: DotNetCoreCLI@2
      displayName: 'dotnet: restore solution'
      inputs:
        command: 'restore'
        projects: '$(solution)'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet: build solution'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet: test'
      inputs:
        command: 'test'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-build --verbosity normal'

    - task: PublishTestResults@2
      displayName: 📗 Publish test results
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/TestResults/*.trx'
        testRunTitle: ($(operatingSystem))
        buildConfiguration: '$(buildConfiguration)'
        buildPlatform: $(operatingSystem)
        mergeTestResults: true
        failTaskOnFailedTests: false
    
    - task: NuGetCommand@2
      displayName: 'Nuget : do nothing (default restore)'
      condition: and(succeeded(), eq(${{ parameters.publishNuGetPackages }}, true))
#  condition: and(succeeded(), eq(${{ parameters.publishNuGetPackages }}, true))
    # - task: NuGetCommand@2
    #   displayName: 'Nuget : empty'
    #   condition: and(succeeded(), eq(${{ parameters.publishNuGetPackages }}, false))

    # - task: NuGetCommand@2
    #   displayName: 'Nuget : pack'
    #   inputs:
    #     command: 'pack'
    #     packagesToPack: '**/StoreLake.Sdk.csproj'
    #     versioningScheme: 'off'
    #     verbosityPack: 'Detailed'
        
    
  # - job: Windows
  #   pool:
  #     vmImage: windows-latest
  #   steps:
    - template: azure-pipelines-template/run.yml
      parameters:
        operatingSystem: Windows
        runtimeIdentifier: win-x64
        configuration: ${{ variables.buildConfiguration }}
        codeCoverageEngine: ${{ variables.codeCoverageEngine }}

    - script: echo "skip nuget push due to parameter value"
      displayName: "Nuget : push-skipped"
      condition: and(succeeded(), eq(${{ parameters.publishNuGetPackages }}, false))

    - task: NuGetCommand@2
      displayName: 'Nuget : push'
      inputs:
        command: 'push'
        packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
        nuGetFeedType: 'external'
        publishFeedCredentials: 'nuget.org'
        verbosityPush: 'Detailed'
      condition: and(succeeded(), eq(${{ parameters.publishNuGetPackages }}, true))

