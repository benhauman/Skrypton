parameters:
- name: publishNuGetPackages
  displayName: Publish NuGet packages (nuget.org)
  type: boolean
  default: false
- name: publishToGitHubPackages
  displayName: Publish to GitHub Packages
  type: boolean
  default: false
- name: createGitHubRelease
  displayName: Create GitHub release
  type: boolean
  default: false

variables:
- name: publishNuGetPackages
  value: ${{ parameters.publishNuGetPackages }}
- name: publishToGitHubPackages
  value: ${{ parameters.publishToGitHubPackages }}
- name: createGitHubRelease
  value: ${{ parameters.createGitHubRelease }}
- name: solution
  value: 'Skrypton.slnx'
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'
- name: codeCoverageEngine
  value: Cobertura

jobs:
# ---------------------------------------------------------------------------
# Test on Linux. Kept on ubuntu so the suite is exercised cross-platform.
# ---------------------------------------------------------------------------
- job: Test
  displayName: 'Test (Linux)'
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0                 # Nerdbank.GitVersioning needs full history

  - template: azure-pipelines-template/initialize.yml

  - task: UseDotNet@2
    displayName: 'Ensure .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.301'
      includePreview: false

  - task: CmdLine@2
    displayName: 'Verify dotnet/sdk'
    inputs:
      script: |
        dotnet --version
        dotnet --list-sdks

  - task: DotNetCoreCLI@2
    displayName: 'dotnet: restore'
    inputs:
      command: 'restore'
      projects: '$(solution)'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet: build'
    inputs:
      command: 'build'
      projects: '$(solution)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  # Run via the dotnet CLI directly (not DotNetCoreCLI@2) so the shell preserves the
  # quotes in --collect:"XPlat Code Coverage"; the task's arg-splitter strips them and
  # also injects a duplicate --logger/--results-directory.
  - script: dotnet test $(solution) --configuration $(buildConfiguration) --no-build --logger trx --results-directory "$(Agent.TempDirectory)/TestResults" --collect:"XPlat Code Coverage"
    displayName: '🧪 dotnet: test (+ coverage)'

  - task: PublishTestResults@2
    displayName: '📊 Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
      testRunTitle: 'Skrypton ($(buildConfiguration))'
      buildConfiguration: '$(buildConfiguration)'
      mergeTestResults: true
      failTaskOnFailedTests: false

  - task: PublishCodeCoverageResults@2
    displayName: '☑️ Publish code coverage'
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'
      pathToSources: '$(Build.SourcesDirectory)'
      failIfCoverageEmpty: true

# ---------------------------------------------------------------------------
# Publish on Windows. NuGetCommand@2 (NuGet.exe) needs mono on Linux, so pack
# and push run on windows-latest using NuGet service connections (no secret
# variables). Skipped entirely unless a publish/release flag is set.
# ---------------------------------------------------------------------------
- job: Publish
  displayName: 'Publish (Windows)'
  dependsOn: Test
  condition: >
    and(succeeded(),
        or(eq(variables['publishNuGetPackages'], 'true'),
           eq(variables['publishToGitHubPackages'], 'true'),
           eq(variables['createGitHubRelease'], 'true')))
  pool:
    vmImage: windows-latest
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - template: azure-pipelines-template/initialize.yml

  - task: UseDotNet@2
    displayName: 'Ensure .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.301'
      includePreview: false

  - task: NuGetToolInstaller@1

  # Pack: produces $(Build.ArtifactStagingDirectory)/packages and publishes the
  # 'NuGet packages' pipeline artifact.
  - template: azure-pipelines-template/run.yml
    parameters:
      operatingSystem: Windows
      runtimeIdentifier: win-x64
      configuration: ${{ variables.buildConfiguration }}
      codeCoverageEngine: ${{ variables.codeCoverageEngine }}

  - task: NuGetCommand@2
    displayName: '📦 Push to nuget.org'
    condition: eq(variables['publishNuGetPackages'], 'true')
    inputs:
      command: 'push'
      packagesToPush: '$(Build.ArtifactStagingDirectory)/packages/**/*.nupkg'
      nuGetFeedType: 'external'
      publishFeedCredentials: 'nuget.org'
      verbosityPush: 'Detailed'

  - task: NuGetCommand@2
    displayName: '📦 Push to GitHub Packages'
    condition: eq(variables['publishToGitHubPackages'], 'true')
    inputs:
      command: 'push'
      packagesToPush: '$(Build.ArtifactStagingDirectory)/packages/**/*.nupkg'
      nuGetFeedType: 'external'
      publishFeedCredentials: 'github-packages'
      verbosityPush: 'Detailed'

  - task: GitHubRelease@1
    displayName: 'Create GitHub release'
    condition: eq(variables['createGitHubRelease'], 'true')
    inputs:
      gitHubConnection: 'benhauman'
      repositoryName: $(Build.Repository.Name)
      target: $(Build.SourceVersion)
      tagSource: userSpecifiedTag
      tag: 'v$(Build.BuildNumber)'
      title: 'v$(Build.BuildNumber)'
      assets: '$(Build.ArtifactStagingDirectory)/packages/*.nupkg'
      changeLogType: commitBased
