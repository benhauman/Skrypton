parameters:
- name: publishNuGetPackages
  displayName: Publish NuGet packages
  type: boolean
  default: false
- name: createGitHubRelease
  displayName: Create GitHub release
  type: boolean
  default: false

variables:
- name: publishNuGetPackages
  value: ${{ parameters.publishNuGetPackages }}
- name: createGitHubRelease
  value: ${{ parameters.createGitHubRelease }}
- name: solution
  value: 'Skrypton.slnx'
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'
- name: codeCoverageEngine
  value: Cobertura

steps:

# FIX for Nerdbank.GitVersioning: disable shallow clone
- checkout: self
  clean: true
  fetchDepth: 0

- script: echo "Running init in Job Init2"
  displayName: "Init 'that'"

- template: azure-pipelines-template/initialize.yml

- script: |
    echo Add publishNuGetPackages:$(publishNuGetPackages)...
    echo See buildPlatform:$(buildPlatform), buildConfiguration:$(buildConfiguration)...
  displayName: 'Run a multiline script'

- task: NuGetToolInstaller@1

- task: UseDotNet@2
  displayName: "Ensure .NET 10 SDK"
  inputs:
    packageType: 'sdk'
    version: '10.0.301'
    includePreview: false

- task: CmdLine@2
  displayName: 'Verify dotnet/sdk'
  inputs:
    script: |
      dotnet --version
      dotnet --list-sdks
      dotnet --info

# Use dotnet CLI for restore/build/test so the installed SDK is used
- task: DotNetCoreCLI@2
  displayName: 'dotnet: restore solution'
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: 'dotnet: build solution'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# Run via the dotnet CLI directly (not DotNetCoreCLI@2) so the shell preserves the
# quotes in --collect:"XPlat Code Coverage"; the task's arg-splitter strips them and
# also injects a duplicate --logger/--results-directory. Works on Linux and Windows.
- script: dotnet test $(solution) --configuration $(buildConfiguration) --no-build --logger trx --results-directory "$(Agent.TempDirectory)/TestResults" --collect:"XPlat Code Coverage"
  displayName: '🧪 dotnet: test (+ coverage)'

- task: PublishTestResults@2
  displayName: '📊 Publish test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
    testRunTitle: 'Skrypton ($(buildConfiguration))'
    buildConfiguration: '$(buildConfiguration)'
    mergeTestResults: true
    failTaskOnFailedTests: false

- task: PublishCodeCoverageResults@2
  displayName: '☑️ Publish code coverage'
  condition: succeededOrFailed()
  inputs:
    summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'
    pathToSources: '$(Build.SourcesDirectory)'
    failIfCoverageEmpty: true

- task: NuGetCommand@2
  displayName: 'Nuget : do nothing (default restore)'
  condition: and(succeeded(), eq(variables['publishNuGetPackages'], 'true'))
#  condition: and(succeeded(), eq(${{ parameters.publishNuGetPackages }}, true))
    # - task: NuGetCommand@2
    #   displayName: 'Nuget : empty'
    #   condition: and(succeeded(), eq(${{ parameters.publishNuGetPackages }}, false))

    # - task: NuGetCommand@2
    #   displayName: 'Nuget : pack'
    #   inputs:
    #     command: 'pack'
    #     packagesToPack: '**/StoreLake.Sdk.csproj'
    #     versioningScheme: 'off'
    #     verbosityPack: 'Detailed'
        
    
  # - job: Windows
  #   pool:
  #     vmImage: windows-latest
  #   steps:
- template: azure-pipelines-template/run.yml
  parameters:
    operatingSystem: Windows
    runtimeIdentifier: win-x64
    configuration: ${{ variables.buildConfiguration }}
    codeCoverageEngine: ${{ variables.codeCoverageEngine }}

- script: echo "skip nuget push due to parameter value"
  displayName: "Nuget : push-skipped"
  condition: and(succeeded(), eq(variables['publishNuGetPackages'], 'false'))

- task: NuGetCommand@2
  displayName: 'Nuget : push'
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget.org'
    verbosityPush: 'Detailed'
  condition: and(succeeded(), eq(variables['publishNuGetPackages'], 'true'))

- task: GitHubRelease@1
  displayName: 'Create GitHub release'
  condition: and(succeeded(), eq(variables['createGitHubRelease'], 'true'))
  inputs:
    gitHubConnection: 'benhauman'
    repositoryName: $(Build.Repository.Name)
    target: $(Build.SourceVersion)
    tagSource: userSpecifiedTag
    tag: 'v$(Build.BuildNumber)'
    title: 'v$(Build.BuildNumber)'
    assets: |
      $(Pipeline.Workspace)/CI/NuGet packages/*.nupkg
      $(Pipeline.Workspace)/CI/Publish output*/*.zip
    changeLogCompareToRelease: lastFullRelease
    changeLogCompareToReleaseTag: v$(NBGV_MAJORMINORVERSION)\.\d+$
    changeLogType: commitBased
