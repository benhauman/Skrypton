# Continuous integration: build and test on Linux and Windows (the build, test and coverage badges).
# Publishing (nuget.org, GitHub release) is the separate pipeline azure-pipeline-publish.yml.

variables:
- name: solution
  value: 'Skrypton.slnx'
# the projects that run on every platform (Skrypton.Windows* need Windows to run their tests)
- name: crossPlatformTests
  value: 'tests/Skrypton.Tests/Skrypton.Tests.csproj'
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'
- name: codeCoverageEngine
  value: Cobertura

jobs:
# ---------------------------------------------------------------------------
# Test on Linux. Kept on ubuntu so the suite is exercised cross-platform.
# ---------------------------------------------------------------------------
- job: Test
  displayName: 'Test (Linux)'
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0                 # Nerdbank.GitVersioning needs full history

  - template: azure-pipelines-template/initialize.yml

  - task: UseDotNet@2
    displayName: 'Ensure .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.301'
      includePreview: false

  - task: CmdLine@2
    displayName: 'Verify dotnet/sdk'
    inputs:
      script: |
        dotnet --version
        dotnet --list-sdks

  - task: DotNetCoreCLI@2
    displayName: 'dotnet: restore'
    inputs:
      command: 'restore'
      projects: '$(crossPlatformTests)'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet: build'
    inputs:
      command: 'build'
      projects: '$(crossPlatformTests)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - script: dotnet test $(crossPlatformTests) --configuration $(buildConfiguration) --no-build --logger trx --results-directory "$(Agent.TempDirectory)/TestResults"
    displayName: '🧪 dotnet: test'

  - task: PublishTestResults@2
    displayName: '📊 Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
      testRunTitle: 'Skrypton Linux ($(buildConfiguration))'
      buildConfiguration: '$(buildConfiguration)'
      mergeTestResults: true
      failTaskOnFailedTests: false

# ---------------------------------------------------------------------------
# Test on Windows: the whole solution - Skrypton, Skrypton.Windows (.NET),
# Skrypton.Windows.NetFx (.NET Framework 4.8) and both command line tools
# (Skrypton.Windows.Tests and Skrypton.Windows.NetFx.Tests run them on the
# demo and parity scripts). Its code coverage is the one of the badge.
# ---------------------------------------------------------------------------
- job: TestWindows
  displayName: 'Test (Windows)'
  pool:
    vmImage: windows-latest
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0                 # Nerdbank.GitVersioning needs full history

  - template: azure-pipelines-template/initialize.yml

  - task: UseDotNet@2
    displayName: 'Ensure .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.301'
      includePreview: false

  - task: DotNetCoreCLI@2
    displayName: 'dotnet: restore'
    inputs:
      command: 'restore'
      projects: '$(solution)'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet: build'
    inputs:
      command: 'build'
      projects: '$(solution)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  # Run via the dotnet CLI directly (not DotNetCoreCLI@2) so the shell preserves the
  # quotes in --collect:"XPlat Code Coverage"; the task's arg-splitter strips them and
  # also injects a duplicate --logger/--results-directory.
  - script: dotnet test $(solution) --configuration $(buildConfiguration) --no-build --logger trx --results-directory "$(Agent.TempDirectory)/TestResults" --collect:"XPlat Code Coverage"
    displayName: '🧪 dotnet: test (+ coverage)'

  - task: PublishTestResults@2
    displayName: '📊 Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
      testRunTitle: 'Skrypton Windows ($(buildConfiguration))'
      buildConfiguration: '$(buildConfiguration)'
      mergeTestResults: true
      failTaskOnFailedTests: false

  - task: PublishCodeCoverageResults@2
    displayName: '☑️ Publish code coverage'
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'
      pathToSources: '$(Build.SourcesDirectory)'
      failIfCoverageEmpty: true

